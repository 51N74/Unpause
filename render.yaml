# Unpause Single-Service Render Deployment Blueprint (Multi-Stage Docker + External Neon PostgreSQL)
#
# Single Render Web Service (runtime: docker):
# - Stage 1 (node:22-alpine): Builds React SPA into apps/web/dist with VITE_API_BASE_URL=/api/v1
# - Stage 2 (golang:1.24-alpine): Compiles Go server and Goose migration binaries
# - Stage 3 (alpine:3.21): Runs ./apps/api-go/bin/server without Node.js at runtime,
#   applies idempotent Goose SQL migrations on startup (AUTO_MIGRATE=true), and serves
#   both the React SPA (STATIC_FILES_DIR=apps/web/dist) and /api/v1/* from the same origin.

services:
  - type: web
    name: unpause
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: AUTO_MIGRATE
        value: "true"
      - key: STATIC_FILES_DIR
        value: apps/web/dist
      - key: VITE_API_BASE_URL
        value: /api/v1
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: SESSION_COOKIE_NAME
        value: unpause_sid
      - key: SESSION_COOKIE_SAMESITE
        value: lax
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: SESSION_TTL_HOURS
        value: 168
      - key: AUTH_RATE_LIMIT_MAX
        value: 25
      - key: CORS_ORIGINS
        sync: false
      - key: GITHUB_API_BASE_URL
        value: https://api.github.com
