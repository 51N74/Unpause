# Add as .github/workflows/unpause.yml in the CONNECTED public repository.
name: Send progress to Unpause
on:
  push:
    branches: [__BRANCH_JSON__]
permissions:
  contents: read
jobs:
  deliver:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Send bounded commit metadata
        env:
          UNPAUSE_DELIVERY_URL: ${{ vars.UNPAUSE_DELIVERY_URL }}
          UNPAUSE_SECRET: ${{ secrets.UNPAUSE_SECRET }}
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import datetime, http.client, json, os, time, urllib.error, urllib.parse, urllib.request
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          with open(os.environ['GITHUB_EVENT_PATH']) as event_file:
              event = json.load(event_file)
          target = os.environ['UNPAUSE_DELIVERY_URL']
          parsed = urllib.parse.urlsplit(target)
          if parsed.scheme != 'https' or not parsed.netloc or parsed.username or parsed.query or parsed.fragment:
              raise SystemExit('Set UNPAUSE_DELIVERY_URL to the HTTPS delivery endpoint from Unpause')
          if len(os.environ['UNPAUSE_SECRET']) != 64:
              raise SystemExit('Set the UNPAUSE_SECRET repository secret')
          branch = os.environ['GITHUB_REF'].removeprefix('refs/heads/')
          if event.get('deleted'):
              raise SystemExit('Deleted branches are not supported; use recovery after restoring the branch')
          def request_json(url):
              for attempt in range(5):
                  try:
                      req = urllib.request.Request(url, headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
                      with opener.open(req, timeout=60) as response:
                          return json.load(response)
                  except urllib.error.HTTPError as error:
                      error.close()
                      if error.code != 429 and error.code < 500:
                          raise SystemExit('GitHub metadata request rejected: HTTP ' + str(error.code))
                  except (urllib.error.URLError, OSError, http.client.HTTPException, json.JSONDecodeError):
                      pass
                  if attempt < 4:
                      time.sleep([15, 30, 60, 120][attempt])
              raise SystemExit('GitHub metadata request exhausted retries')
          sha = event['after']
          url = 'https://api.github.com/repos/' + event['repository']['full_name'] + '/commits?per_page=100&sha=' + urllib.parse.quote(sha, safe='')
          commits = request_json(url)
          payload = {
              'deliveryId': 'actions:' + os.environ['GITHUB_RUN_ID'],
              'repositoryId': event['repository']['id'], 'branch': branch,
              'eventAt': event.get('head_commit', {}).get('timestamp') or datetime.datetime.now(datetime.timezone.utc).isoformat(),
              'incomplete': bool(event.get('forced')) or len(commits) == 100,
              'commits': [{'sha': c['sha'], 'message': c['commit']['message'][:2000], 'author': (c['commit']['author']['name'] or '')[:200], 'eventAt': c['commit']['author']['date']} for c in commits]
          }
          body = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode()
          while len(body) > 256 * 1024 and len(payload['commits']) > 1:
              payload['commits'].pop()
              payload['incomplete'] = True
              body = json.dumps(payload, ensure_ascii=False, separators=(',', ':')).encode()
          for attempt in range(5):
              try:
                  req = urllib.request.Request(target, data=body, method='POST', headers={'Content-Type': 'application/json', 'Authorization': 'Bearer ' + os.environ['UNPAUSE_SECRET']})
                  with opener.open(req, timeout=90) as response:
                      if response.status == 200:
                          print('Unpause accepted the update at ' + datetime.datetime.now(datetime.timezone.utc).isoformat())
                          break
              except urllib.error.HTTPError as error:
                  error.close()
                  if error.code != 429 and error.code < 500:
                      raise SystemExit('Unpause rejected delivery: HTTP ' + str(error.code))
                  print('Temporary delivery failure: HTTP ' + str(error.code))
              except (urllib.error.URLError, OSError, http.client.HTTPException, json.JSONDecodeError):
                  print('Temporary delivery network failure')
              if attempt == 4:
                  raise SystemExit('Unpause delivery exhausted retries; retry this run or use recovery')
              time.sleep([15, 30, 60, 120][attempt])
